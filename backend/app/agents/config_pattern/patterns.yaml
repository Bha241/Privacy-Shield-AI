NAME:
  regex: "(?:[•\\*\\-\\s]*\\b(?:Full Name|Customer Name|Taxpayer Name|Taxpayer|Name|Signed by|Patient|Applicant|Holder|Student|User|Licensor|Licensee|Recipient|Coordinator|Logistics Coordinator|Dispatch Officer|Officer|Accountant|Manager|Contact|Representative|Primary Representative|Signatory|Physician|Doctor|Executive|Delegate)[:\\s]+)([A-Za-z0-9\\.\\'\\-]+(?:[ \\t]+[A-Za-z0-9\\.\\'\\-]+){1,3})|(?:Mr\\.|Mrs\\.|Ms\\.|Shri|Smt|Dr\\.|Prof\\.|son/daughter of|s/o|d/o|w/o|c/o)[:\\s]+([A-Z][a-zA-Z\\.\\'\\-]+(?:[ \\t]+[A-Z][a-zA-Z\\.\\'\\-]+){1,3})"
  confidence: 0.98

DATE_OF_BIRTH:
  regex: "(?:[•\\*\\-\\s]*\\b(?:Date of Birth|DOB|Date of birth|Birth Date)[:\\s]+)([0-9]{1,2}[\\s\\/\\.-]+(?:Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|Jul(?:y)?|Aug(?:ust)?|Sep(?:tember)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?|[0-9]{1,2})[\\s\\/\\.-]+[0-9]{2,4})"
  confidence: 0.98

DATE:
  regex: "\\b(?:\\d{1,2}\\s+(?:Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|Jul(?:y)?|Aug(?:ust)?|Sep(?:tember)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)\\s+\\d{2,4}|\\d{1,2}[/-]\\d{1,2}[/-]\\d{2,4}|\\d{4}[/-]\\d{1,2}[/-]\\d{1,2})\\b"
  confidence: 0.90

AGE:
  regex: '\b(?:Age|Aged)[:\s]+(\d{1,3}\s*(?:Years|Yrs|Yr)?)\b'
  confidence: 0.98

GENDER:
  regex: '\b(?:Gender|Sex)[:\s]+(Male|Female|Transgender|Other)\b'
  confidence: 0.98

PAN:
  regex: '\b[A-Za-z]{5}\s?[0-9]{4}\s?[A-Za-z]\b|\b[A-Za-z]{3,5}[0-9]{4}[A-Za-z]\b'
  confidence: 1.0

AADHAAR:
  regex: '(?:\b[2-9]\d{3}[-.\s]?\d{4}[-.\s]?\d{4}\b|\b\([2-9]\d{3}\)[-.\s]?\d{4}[-.\s]?\d{4}\b)'
  confidence: 1.0

EMAIL:
  regex: '\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b'
  confidence: 1.0

PHONE:
  regex: '(?:\+?\d{1,4}[-.\s]?)?(?:\(\d{2,5}\)[-.\s]?)?\b\d{3,5}[-.\s]?\d{3,5}\b|\b(?:\+?91[-.\s]?)?[5-9]\d{8,9}\b|\b(?:\+?\d{1,3}[-.\s]?)?\d{9,11}\b|\b(?:\+?91[-.\s]?)?\d{1,4}[X*]{2,8}\d{1,4}\b'
  confidence: 0.98

MONEY:
  regex: '(?:₹|Rs\.?|INR)\s*[\d,]+(?:\.\d{2})?\b'
  confidence: 0.95

ADDRESS:
  regex: '\b(?:Flat|Apartment|Unit|Plot|House)\s+(?:No\.?|Number)?\s*[A-Z0-9/-]+\b|\b(?:Pin\s*code|Pincode|PIN)[:\s\ -]+(\d{6})\b'
  confidence: 0.95

IFSC:
  regex: '\b[A-Za-z]{4}0[A-Za-z0-9]{6}\b'
  confidence: 1.0

ACCOUNT_NUMBER:
  regex: '\b\d{9,18}\b'
  confidence: 0.95

UPI:
  regex: '\b[a-zA-Z0-9._-]+@[a-zA-Z0-9.-]+\b'
  confidence: 0.95

SSN:
  regex: '(?:\b\d{3}-\d{2}-\d{4}\b|\bSSN[:\s]+\d{9}\b)'
  confidence: 1.0

PASSPORT:
  regex: '\b[A-PR-WYa-pr-wy][0-9]{7}\b'
  confidence: 0.95

DRIVING_LICENSE:
  regex: '\bDL[-:\s]*[A-Za-z0-9]{8,15}\b|\b[A-Z]{2}[- ]?\d{2}[- ]?(?:19|20)\d{2}[- ]?\d{7}\b|\b[A-Z]{2}\d{13}\b|\bDriving\s*Licen[sc]e[:\s]+[A-Za-z0-9\-]{8,16}\b'
  confidence: 0.95

VEHICLE_REGISTRATION:
  regex: '\b[A-Za-z]{2}[- ]?\d{1,2}[- ]?[A-Za-z]{1,3}[- ]?\d{4}\b'
  confidence: 0.95

CREDIT_CARD:
  regex: '\b(?:\d{4}[- ]?){3}\d{4}\b|\bxxxx[- ]?xxxx[- ]?xxxx[- ]?\d{4}\b'
  confidence: 0.95

IP_ADDRESS:
  regex: '\b(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\b|\b(?:[0-9a-fA-F]{1,4}:){7}[0-9a-fA-F]{1,4}\b'
  confidence: 0.95

PASSWORD_CREDENTIAL:
  regex: '\b(?:pwd|password|login password|secret|api key)[\s:=]+[^\s,]{4,}'
  confidence: 0.95

# --- DOMAIN SPECIFIC PATTERNS ---
GSTIN:
  regex: '\b\d{2}[A-Za-z]{5}\d{4}[A-Za-z]{1}[A-Za-z0-9]{1}[Zz]{1}[A-Za-z0-9]{1}\b'
  confidence: 1.0
  domains: ['all', 'general', 'finance', 'supply_chain', 'ecommerce']

TAX_ID:
  regex: '\b(?:Taxpan|Tax\s*PAN|Tax\s*ID|PAN\s*ID|TIN|EIN)[:\s]+[A-Za-z0-9\-]{8,15}\b'
  confidence: 0.98
  domains: ['all', 'general', 'finance']

ORDER_ID:
  regex: '\b(?:Order\s*(?:ID|No\.?|Number)|OD|ORD)[-:\s]*[A-Z0-9\-]{6,25}\b'
  confidence: 0.95
  domains: ['all', 'general', 'ecommerce']

TRACKING_NUMBER:
  regex: '\b(?:Tracking\s*(?:ID|No\.?|Number)|AWB)[-:\s]*[A-Z0-9]{8,25}\b'
  confidence: 0.95
  domains: ['all', 'general', 'ecommerce', 'supply_chain']

INVOICE_NUMBER:
  regex: '\b(?:Invoice\s*(?:ID|No\.?|Number)|INV\s*#?|Invoice\s*#)[:\s\-]+[A-Za-z0-9\/-]{4,25}\b|\bINV-[A-Za-z0-9]{4,20}\b'
  confidence: 0.95
  domains: ['all', 'general', 'supply_chain', 'finance', 'ecommerce']

CONTAINER_ID:
  regex: '\b[A-Z]{4}\d{7}\b'
  confidence: 0.95
  domains: ['all', 'general', 'supply_chain']

BILL_OF_LADING:
  regex: '\b(?:B\/L|BOL|Bill of Lading)[-:\s]*[A-Za-z0-9\-]{6,20}\b'
  confidence: 0.95
  domains: ['all', 'general', 'supply_chain']

MRN:
