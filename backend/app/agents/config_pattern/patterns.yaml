  confidence: 0.98
  domains: ['all', 'general', 'healthcare', 'medical']

HEALTH_INSURANCE_ID:
  regex: '\b(?:Policy No\.?|Health ID|UHID|Insurance ID)[-:\s]*[A-Za-z0-9\-]{6,20}\b'
  confidence: 0.95
  domains: ['all', 'general', 'healthcare', 'medical']