services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: privacyshield-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - backend_uploads:/app/temp_uploads
      - backend_db:/app/data
    networks:
      - privacyshield-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=/api/v1
    container_name: privacyshield-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - privacyshield-net

  nginx:
    image: nginx:alpine
    container_name: privacyshield-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - privacyshield-net

volumes:
  backend_uploads:
  backend_db:

networks:
  privacyshield-net:
    driver: bridge
